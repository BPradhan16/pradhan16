<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pradhan16 AI</title>
    <script src="script.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Pradhan16 AI</h1>
        <h2>AI Trading Journal</h2>

        <button onclick="openJournal()">
            Open Trading Journal
        </button>

        <div id="journal" style="display: none;">

            <h2>My Trading Journal</h2>

            <input
                type="text"
                id="symbol"
                placeholder="Symbol e.g. NIFTY"
            >

            <input
                type="number"
                id="entry"
                placeholder="Entry Price"
            >

            <input
                type="number"
                id="exit"
                placeholder="Exit Price"
            >

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
            >

            <button onclick="calculatePL()">
                Calculate P/L
            </button>

            <p id="plMessage"></p>

            <button onclick="saveTrade()">
                Save Trade
            </button>

            <p id="tradeMessage"></p>

            <button onclick="openReview()">
                Review
            </button>

            <div id="review" style="display: none;">
                <h2>Trade Review</h2>
                <p id="reviewMessage"></p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
