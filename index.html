<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pradhan16 AI</title>
    <script src="script.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<!-- =========================================
     Pradhan16 AI — Trading Statistics
     Day 20: Statistics Dashboard
     ========================================= -->

<section id="statistics">
    <h2>Trading Statistics</h2>

    <div>
        <p>Total Trades: <span id="totalTrades">0</span></p>

        <p>Winning Trades: <span id="winningTrades">0</span></p>

        <p>Losing Trades: <span id="losingTrades">0</span></p>

        <p>Win Rate: <span id="winRate">0%</span></p>

        <p>Gross Profit: ₹<span id="grossProfit">0</span></p>

        <p>Gross Loss: ₹<span id="grossLoss">0</span></p>

        <p>Average Profit: ₹<span id="averageProfit">0</span></p>

        <p>Average Loss: ₹<span id="averageLoss">0</span></p>

        <p>Profit Factor: <span id="profitFactor">0</span></p>

        <p>Expectancy: ₹<span id="expectancy">0</span></p>
    </div>
</section>
<body>

    <div class="container">

        <h1>Pradhan16 AI</h1>
        <h2>AI Trading Journal</h2>

        <button onclick="openJournal()">
            Open Trading Journal
        </button>

        <div id="journal" style="display: none;">

            <h2>My Trading Journal</h2>

            <input
                type="text"
                id="symbol"
                placeholder="Symbol e.g. NIFTY"
            >

            <input
                type="number"
                id="entry"
                placeholder="Entry Price"
            >

            <input
                type="number"
                id="exit"
                placeholder="Exit Price"
            >

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
            >

            <button onclick="calculatePL()">
                Calculate P/L
            </button>

            <p id="plMessage"></p>

            <button onclick="saveTrade()">
                Save Trade
            </button>

            <p id="tradeMessage"></p>

            <button onclick="openReview()">
                Review
            </button>

            <div id="review" style="display: none;">
                <h2>Trade Review</h2>
                <p id="reviewMessage"></p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</html>
<!-- =========================================
     DAY 21 — P/L PERFORMANCE CHART
     ========================================= -->

<section id="performanceChart">

    <h2>P/L Performance</h2>

    <canvas id="plChart" width="400" height="250"></canvas>

</section>
